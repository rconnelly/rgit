[package]
name = "rabun-git"
version = "0.12.0"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted git forge CLI: SSH remotes, merge requests, and YAML workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rconnelly/rgit"
homepage = "https://github.com/rconnelly/rgit"
keywords = ["cli", "git", "ssh", "forge", "rabun"]
categories = ["command-line-utilities"]
exclude = [".github"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
rand = "0.10"
russh = "0.63"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"
shlex = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "sync",
    "time",
    "fs",
    "process",
    "net",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
