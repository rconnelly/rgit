name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: ./scripts/install-linux-build-deps.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Deploy scripts
        run: |
          bash -n deploy/ubuntu/pack.sh deploy/ubuntu/push.sh deploy/ubuntu/bootstrap.sh deploy/ubuntu/install.sh deploy/ubuntu/register-app.sh
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items
      - name: Test
        run: cargo test --locked
      - name: Package
        run: cargo package --locked --no-verify

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-build-deps.sh
      - name: Release build
        run: cargo build --release --locked --target ${{ matrix.target }}
